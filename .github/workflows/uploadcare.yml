name: Upload images to Uploadcare

on:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Uploadcare CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/uploadcare/uploadcare-cli/main/scripts/install.sh | sh
      - name: Validate image types
        env:
          UPLOADCARE_PUBLIC_KEY: ${{ secrets.UPLOADCARE_PUBLIC_KEY }}
          UPLOADCARE_SECRET_KEY: ${{ secrets.UPLOADCARE_SECRET_KEY }}
        run: |
          result=$(uploadcare file upload images/* \
            --store true \
            --dry-run \
            --json all)
      
          echo "$result" | jq .
      
          invalid=$(echo "$result" | jq -r '
            .[]
            | select(
                .content_type != "image/jpeg" and
                .content_type != "image/png" and
                .content_type != "image/webp" and
                .content_type != "image/gif" and
                .content_type != "image/avif"
              )
            | "\(.path): \(.content_type)"
          ')
      
          if [ -n "$invalid" ]; then
            echo "The following files have unsupported MIME types:"
            echo "$invalid"
            exit 1
          fi
      
          echo "All files passed MIME type validation."
      - name: Upload images
        id: upload
        env:
            UPLOADCARE_PUBLIC_KEY: ${{ secrets.UPLOADCARE_PUBLIC_KEY }}
            UPLOADCARE_SECRET_KEY: ${{ secrets.UPLOADCARE_SECRET_KEY }}
        run: |
          result=$(uploadcare file upload images/* --json uuid,filename,mime_type)
          echo "results=$result" >> "$GITHUB_OUTPUT"

      - name: Generate transformed URLs
        env:
          UPLOAD_RESULTS: ${{ steps.upload.outputs.results }}
        run: |
          echo "$UPLOAD_RESULTS" | jq -r '
            .[]
            | "\(.filename) -> https://ucarecdn.com/\(.uuid)/-/preview/800x600/"
          '

